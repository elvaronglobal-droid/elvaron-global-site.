<title>ELVARON GLOBAL</title>
<meta name="description" content="ELVARON GLOBAL — Research. Innovate. Build the Future.">
<style>
:root{--bg:#05070d;--navy:#0a1630;--card:#0c1a38;--blue:#1e90ff;--txt:#fff;--mut:#9fb3d1;--line:#1b2c52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d}}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
a{color:var(--blue);text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:rgba(5,7,13,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.12em;color:#fff}.brand small{color:var(--blue);font-weight:600;font-size:.6em;margin-left:4px}
nav{display:flex;gap:16px;font-size:.85rem}nav a{color:var(--mut)}
select{background:var(--navy);color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem}
@media(max-width:700px){nav{display:none}}
section{padding:56px 20px;max-width:980px;margin:auto}
.hero{text-align:center;padding-top:36px;background:radial-gradient(ellipse at 50% 0,#0d2a5c55,transparent 65%)}
.hero img{width:min(300px,70%);mix-blend-mode:screen}
h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.15;margin:10px 0 14px}
h2{font-size:1.6rem;margin:0 0 14px}h2:after{content:"";display:block;width:44px;height:3px;background:var(--blue);margin-top:8px;border-radius:2px}
p{color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{padding:11px 20px;border-radius:10px;border:1px solid var(--blue);color:#fff;font-weight:600;font-size:.92rem}
.btn.p{background:var(--blue);box-shadow:0 0 24px #1e90ff55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:linear-gradient(160deg,var(--card),#08112a);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;color:#fff;font-size:1.05rem}.card h3:before{content:"◆ ";color:var(--blue);font-size:.8em}
ol{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt)}
ol li:before{content:counter(s);color:var(--blue);font-weight:800;margin-right:12px}
form{display:grid;gap:10px;margin-top:14px}
input,textarea{width:100%;background:var(--navy);border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px;font:inherit}
button{cursor:pointer;font:inherit}
.soon{border-style:dashed;text-align:center;padding:26px}
footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--mut);font-size:.85rem}
footer .brand{display:block;margin-bottom:6px}
</style>
</head>
